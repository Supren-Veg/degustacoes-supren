<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Degustações — desativado | Supren Veg</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #212121;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
  }
  .card {
    background: #fff;
    max-width: 460px;
    width: 100%;
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    border-top: 5px solid #1B5E20;
    text-align: center;
  }
  .brand {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #1B5E20;
    margin-bottom: 24px;
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 16px; }
  p { font-size: 16px; color: #555; margin-bottom: 12px; }
  .btn {
    display: inline-block;
    margin-top: 20px;
    background: #1B5E20;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .btn:hover { background: #14471a; }
  .hint { font-size: 13px; color: #999; margin-top: 24px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Supren Veg</div>
    <h1>Este portal foi desativado</h1>
    <p>Os agendamentos e formulários de degustação agora ficam dentro do sistema de gestão.</p>
    <p>Abra a degustação por lá e clique no formulário que você precisa preencher.</p>
    <a class="btn" href="https://gestao-supren-production.up.railway.app/degustacoes">Ir para o sistema</a>
    <p class="hint">Se o link antigo estiver salvo no seu celular, troque pelo endereço acima.</p>
  </div>
</body>
</html>
