<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Formulário mudou de lugar — Supren Veg</title>
<style>
  :root{--verde:#4ade80;--bg:#0d100e;--card:#141a16;--txt:#e8efe9;--dim:#9db0a3;--line:#243028}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--txt);font:16px/1.6 "Segoe UI",system-ui,sans-serif;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:32px 28px;max-width:460px;text-align:center}
  h1{font-size:22px;margin:0 0 12px}
  p{color:var(--dim);margin:0 0 20px}
  a.botao{display:inline-block;background:var(--verde);color:#0d100e;font-weight:700;
          text-decoration:none;padding:14px 28px;border-radius:10px;font-size:16px}
  a.botao:hover{filter:brightness(1.1)}
  .rodape{margin-top:22px;font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
  <div class="card">
    <h1>Este formulário mudou de lugar</h1>
    <p>Os formulários de degustação agora ficam <strong>dentro do Gestão Supren Veg</strong>, com login.
       O que for preenchido aqui nesta página <strong>não é mais salvo</strong>.</p>
    <a class="botao" href="https://gestao-supren-production.up.railway.app/degustacoes">Abrir no Gestão</a>
    <p class="rodape">Se você não tem acesso ao Gestão, fale com o Ygor.</p>
  </div>
</body>
</html>
